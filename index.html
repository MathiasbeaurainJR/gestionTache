<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Tâches</title>
    <!-- Importation de Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Gestionnaire de Tâches</h1>
            <p class="text-muted">Organisez vos projets en binôme facilement</p>
        </header>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="h4 card-title mb-3" id="form-title">Ajouter une tâche</h2>
                        <form id="task-form">
                            <div class="mb-3">
                                <label for="title" class="form-label">Titre *</label>
                                <input type="text" class="form-control" id="title" required placeholder="Ex: Réviser JavaScript">
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" placeholder="Détails de la tâche..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Statut</label>
                                <select class="form-select" id="status">
                                    <option value="à faire">À faire</option>
                                    <option value="en cours">En cours</option>
                                    <option value="terminée">Terminée</option>
                                    <option value="bloquée">Bloquée</option>
                                </select>
                            </div>
                            <button type="submit" id="submit-btn" class="btn btn-primary w-100">Ajouter la tâche</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <!-- Barre de recherche et filtres -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="search-input" placeholder="🔍 Rechercher dans le titre ou la description...">
                        </div>
                        <div class="d-flex flex-wrap gap-2" id="filter-buttons">
                            <button class="btn btn-outline-secondary btn-sm active filter-btn" data-filter="toutes">Toutes</button>
                            <button class="btn btn-outline-secondary btn-sm filter-btn" data-filter="à faire">À faire</button>
                            <button class="btn btn-outline-secondary btn-sm filter-btn" data-filter="en cours">En cours</button>
                            <button class="btn btn-outline-secondary btn-sm filter-btn" data-filter="terminée">Terminée</button>
                            <button class="btn btn-outline-secondary btn-sm filter-btn" data-filter="bloquée">Bloquée</button>
                        </div>
                    </div>
                </div>
                <div id="tasks-container" class="row g-3">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
